[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onboarding-copilot-backend"
version = "0.2.0"
readme = "README.md"
description = "Google ADK invitation proposal agent with approval-backed onboarding workspace"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0", "ag-ui-adk==0.4.2", "ag-ui-protocol==0.1.22", "fastapi==0.141.1", "uvicorn==0.54.0", "google-genai==2.31.0", "httpx==0.28.1", "pydantic==2.14.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
onboarding-workspace = "onboarding_workspace.api:main"

[tool.hatch.build.targets.wheel.force-include]
"data" = "onboarding_workspace/sample_data"
"fixtures" = "onboarding_workspace/original_data"

[tool.hatch.build.targets.sdist]
include = ["src", "data", "fixtures", "tests", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
